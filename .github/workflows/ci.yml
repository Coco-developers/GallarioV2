name: Continious Intergration
run-name: ${{ github.actor }} Pushed.
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan serveo.net >> ~/.ssh/known_hosts

      - name: Deploy
        run: >
          ssh -J serveo.net -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no prod@g-ahid
          "cd ~/GallarioV2/ && git pull && docker build -t gallario . && docker stop gallario || true && docker rm gallario || true && docker run -v gallario_db:/app -p 80:8000 -d --name gallario gallario"